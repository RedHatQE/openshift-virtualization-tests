[tox]
envlist=pytest-check,unused-code
skipsdist=True

[testenv]
basepython = python3

[testenv:pytest-check]
basepython = python3.12
recreate=True
setenv =
    PYTHONPATH = {toxinidir}
    LC_ALL = en_US.utf8
    LANG = en_US.utf8
    UV_PYTHON = python3.12
deps=
    uv
commands =
    uv run pytest --collect-only
    uv run pytest --upgrade=cnv --cnv-image=NA --cnv-version=NA --collect-only
    uv run pytest --upgrade=ocp --ocp-image=NA --collect-only
    uv run pytest --upgrade=eus --cnv-image=NA --cnv-version=NA --eus-ocp-images=NA,NA --collect-only
    uv run pytest --upgrade_custom=cnv --cnv-image=NA --cnv-version=NA --collect-only
    uv run pytest --upgrade_custom=ocp --ocp-image=NA --collect-only
    uv run pytest --tc-file=tests/global_config_aws.py --collect-only
    uv run pytest --tc-file=tests/global_config_rh_it.py --collect-only
    uv run pytest --tc-file=tests/global_config.py -m smoke --collect-only
    uv run pytest --tc-file=tests/global_config.py --tc-format=python --setup-plan


#Jira
# TODO: remove once verify-bugs-are-open-gh is checked and works properly
[testenv:verify-bugs-are-open]
recreate=True
setenv =
    PYTHONPATH = {toxinidir}
deps:
    python-utility-scripts
commands =
    pip install pip --upgrade
    pip install tox --upgrade
    pyutils-jira --config-file-path jira.cfg --target-versions "4.19.1,4.19.z" --verbose

[testenv:verify-bugs-are-open-gh]
recreate=True
passenv =
    JIRA_TOKEN
    JIRA_USER
setenv =
    PYTHONPATH = {toxinidir}
deps =
    python-utility-scripts
commands =
    pyutils-jira --cloud --url https://redhat.atlassian.net --target-versions "4.19.0,4.19.z" --resolved-statuses "verified,release pending,closed" --issue-pattern "([A-Z]+-[0-9]+)" --verbose

#Unused code
[testenv:unused-code]
recreate=True
setenv =
    PYTHONPATH = {toxinidir}
deps:
    python-utility-scripts
commands =
    pyutils-unusedcode --exclude-files "pytest_matrix_utils.py" --exclude-function-prefixes "pytest_"

# Utilities unit tests with coverage verification
[testenv:utilities-unittests]
basepython = python3.14
recreate = True
setenv =
    PYTHONPATH = {toxinidir}
    LC_ALL = en_US.utf8
    LANG = en_US.utf8
    UV_PYTHON = python3.14
    # Isolate the uv-managed venv for this env: `uv run --extra utilities-test`
    # installs extra packages (e.g. pytest-xdist) that plain `uv run` syncs in the
    # other parallel tox envs remove from the shared project .venv mid-run,
    # causing plugin loading races (pytest_progress sees a half-installed xdist).
    UV_PROJECT_ENVIRONMENT = {toxworkdir}/{envname}/uv-venv
deps =
    uv
commands =
    # Run utilities unit tests with coverage (configuration in main pyproject.toml)
    uv run --extra utilities-test pytest utilities/unittests/ --cov=utilities --cov-report=term --cov-report=html:utilities/htmlcov --cov-report=xml:utilities/coverage.xml --cov-fail-under=95 -v
    # Display final coverage summary
    uv run python -c "print('\n✅ All utilities unit tests passed with required coverage threshold!')"
