# yaml-language-server: $schema=https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow/main/schemas/qualityflow.schema.json
# Scale team. Only what this directory adds to tests/.qualityflow/.
#
# decorator_mappings, where a team has one, is keyed by the SIG a scenario in
# this directory carries (its owning_sig) and names the decorator the upstream
# Go test carries: QualityFlow derives that lookup by dropping the "sig-" prefix
# from the keys.
version: 1
project_id: "cnv"
# Recorded for reviewers: nothing reads sig_mappings today. What routes
# generated code is package_name_rules in this directory's
# code_generation_config.yaml; keep the two in step.
sig_mappings:
  sig-scale: "scale"
  sig-virt: "scale"

decorator_mappings:
  sig-scale: "SigPerformance"
  sig-virt: "SigPerformance"

feature_toggles:
  # No tier generates for this team: `scale` is in conftest.py's
  # EXCLUDE_MARKER_FROM_TIER2_MARKER, and no layer can put @pytest.mark.scale on
  # generated code, so a generated density benchmark would run in the tier2
  # lane. With every tier file disabled stub-generator would instead exit on "No
  # enabled language configs found", so the two phases are switched off here and
  # /generate-tests reports "No test generation targets configured" and stops.
  tier1_tests: false
  tier2_tests: false
