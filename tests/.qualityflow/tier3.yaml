# Tier 3: a label only, for a different reason than Tier 1.
#
# Tier 3 tests do belong in this repository and carry @pytest.mark.tier3 by
# hand. What a layer cannot do is make a generated test carry that marker:
# tier*.yaml `markers` is in the schema's allowlist but no consumer reads it
# (test-generator's tier-config fields are tier, language, framework,
# reference_guide, imports, build_command and test_patterns), and the one marker
# path that does reach generated code is the project's `scenario_tiers`, which
# applies in auto mode only. A generated test without a tier marker is stamped
# tier2 by conftest.py and would run in the tier2 lane, which for cost-heavy
# Tier 3 work is worse than not generating at all.
#
# So Tier 3 stays a label an STP can carry, with no generation behind it. As
# with tier1.yaml, the file is what keeps [Tier 3] in tier-classifier's
# available tiers, since it is handed every tier*.yaml rather than only the
# enabled ones.
#
# A team adds `description` and, where a genuine Tier 3 module exists,
# `reference_tests`; otherwise it sets `reference_tests: null`.
enabled: false
tier: "Tier 3"
display_name: "Extended Validation"
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs/blob/main/docs/testing-tiers.md"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
