name: Scripts Unit Tests

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'utilities/**'
      - 'tox.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/scripts-unit-tests.yml'

  workflow_dispatch:

jobs:
  check-approval:
    name: Check PR Approval
    # Fetch author_association via REST API; webhook payload is unreliable
    # for pull_request_target events.
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/check-pr-approval.yml
    secrets:
      ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}

  scripts-unit-tests:
    name: Run Scripts Unit Tests
    needs: [check-approval]
    if: "!cancelled() && (needs.check-approval.result == 'success' || needs.check-approval.result == 'skipped')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Org members run automatically; outside contributors need maintainer approval
    environment: ${{ needs.check-approval.outputs.needs_approval == 'true' && 'external-pr-tests' || '' }}
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Install uv-tox
        run: uv tool install tox --with tox-uv

      - name: Run tests
        run: tox -e scripts-unittests
