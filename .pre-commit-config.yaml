default_language_version:
  python: python3.14

ci:
  skip: [check-jsonschema, check-staged-paths, check-linter-directives, check-python-source, check-test-std, check-stp-links]

repos:
  - repo: https://github.com/PyCQA/autoflake
    rev: "v2.4.0"
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-unused-variables
          - --remove-all-unused-imports
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        stages: [pre-commit]
      - id: ruff
        name: sort imports with ruff
        args: [--select, I, --fix]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-ast
        stages: [pre-commit]
      - id: check-builtin-literals
        stages: [pre-commit]
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
  - repo: https://github.com/PyCQA/flake8
    rev: "7.4.1"
    hooks:
      - id: flake8
        language_version: python3.14
        args: [--config=.flake8]
        # Hook unit tests embed intentionally non-compliant source fixtures.
        exclude: "(utilities/unittests/|utilities/junit_ai_utils\\.py|scripts/std_placeholder_stats/tests/|scripts/coderabbit_retry/tests/test_coderabbit_retry\\.py|scripts/pre_commit_hooks/tests/)"
        additional_dependencies:
          [
            "git+https://github.com/RedHatQE/flake8-plugins.git@v1.0.0",
            "flake8-mutable",
            "pep8-naming",
          ]
        stages: [pre-commit]

  - repo: https://github.com/jorisroovers/gitlint
    rev: "v0.19.1"
    hooks:
      - id: gitlint
        stages: [commit-msg]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-jsonschema
        name: Validate .coderabbit.yaml against schema
        files: ^\.coderabbit\.yaml$
        args: ["--schemafile", "https://coderabbit.ai/integrations/schema.v2.json"]
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.0"
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-staged-paths
        name: ban bad staged paths (generated docs/site, top-level tests) and staged symlinks
        entry: uv run python scripts/pre_commit_hooks/check_policy.py --check path-policy
        language: system
        types: [file]
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: check-linter-directives
        name: linter suppression directives require approved manifest records
        entry: uv run python scripts/pre_commit_hooks/check_policy.py --check linter-directives
        language: system
        types: [file]
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: check-python-source
        name: python source policy (forbidden constructs, imports, resource clients, test markers)
        entry: uv run python scripts/pre_commit_hooks/check_policy.py --check python-source
        language: system
        types: [file]
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: check-test-std
        name: STD docstring and manual-marker policy for staged tests
        entry: uv run python scripts/pre_commit_hooks/check_policy.py --check test-std
        language: system
        types: [file]
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: check-stp-links
        name: STP references must be merged in the design-docs repository
        entry: uv run python scripts/pre_commit_hooks/check_policy.py --check stp-links
        language: system
        types: [file]
        always_run: true
        require_serial: true
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        exclude: "test_(.*).py$"
        additional_dependencies:
          [
            "types-PyYAML",
            "types-requests",
            "types-paramiko",
            "types-beautifulsoup4",
            "pytest",
            "types-xmltodict",
            "types-setuptools",
            "types-pexpect",
            "types-netaddr",
            "types-cachetools"
          ]
