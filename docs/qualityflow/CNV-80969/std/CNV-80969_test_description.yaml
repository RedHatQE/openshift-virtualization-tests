          validation: "CNV CSV at 4.20.7"
        - step_id: "TEST-02"
          action: "Stop and start VM on broken build"
          command: "virtctl stop <vm>; virtctl start <vm>"
          validation: "Disks observed offline in guest (bug reproduced)"
        - step_id: "TEST-03"
          action: "Manually re-online all disks via Windows Disk Manager"
          command: "guest: Set-Disk -IsOffline $false for each disk"
          validation: "All 5 disks online"
        - step_id: "TEST-04"
