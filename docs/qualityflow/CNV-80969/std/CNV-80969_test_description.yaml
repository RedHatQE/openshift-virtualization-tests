        requirement: "5 VirtIO disks, memory > 2 GiB, all disks online with simple volumes on CNV 4.19"
        validation: "oc get vmi <vm> -o jsonpath='{.spec.domain.devices.disks}'"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create running Windows Server 2022 VM with 5 VirtIO disks, memory > 2 GiB, all disks online"
          command: "oc apply -f windows-vm.yaml; wait for Running"
          validation: "VMI phase Running; 5 disks online in guest"
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade CNV to 4.20.7 (broken build)"
