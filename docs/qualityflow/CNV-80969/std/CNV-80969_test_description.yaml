        - "VMI has the v3 PCI topology annotation after upgrade"
        - "All disks online and PCI addresses unchanged after reboot"
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest e2e over live cluster upgrade"
    specific_preconditions:
      - name: "Windows Server 2022 VM"
        requirement: "5 VirtIO disks on CNV 4.19, all online"
        validation: "oc get vmi <vm> -o jsonpath='{.spec.domain.devices.disks}'"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create running Windows VM with 5 VirtIO disks on CNV 4.19"
          command: "oc apply -f windows-vm.yaml; virtctl start <vm>"
          validation: "VMI Running; 5 disks online"
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade CNV directly from 4.19 to 4.20.8 (fixed build)"
          command: "patch to 4.20.8; wait for CSV Succeeded"
          validation: "CNV CSV at 4.20.8"
        - step_id: "TEST-02"
          action: "Reboot VM"
          command: "virtctl restart <vm>"
          validation: "VMI Running"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the Windows VM"
          command: "oc delete vm <vm>"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "VMI carries v3 PCI topology annotation"
        condition: "VMI PCI topology version annotation == v3"
        failure_impact: "Direct upgrade path does not produce fixed topology"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "All disks online with unchanged addresses"
        condition: "All 5 disks online; PCI addresses identical before/after"
        failure_impact: "Disk offline regression on the common upgrade path"
