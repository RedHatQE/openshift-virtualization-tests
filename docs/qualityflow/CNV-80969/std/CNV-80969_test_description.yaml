  - scenario_id: "9"
    test_id: "TS-CNV-80969-009"
    test_type: "functional"
    priority: "P2"
    priority_comment: "P2 — behavior must be storage-class independent (confirmed in Jira)."
    mvp: false
    requirement_id: "CNV-80969"
    coverage_status: "NEW"
    test_objective:
      title: "Storage class independence verification"
      what: |
        A Windows VM on CNV 4.19 has disks backed by two different storage classes
        (e.g., OCS Ceph RBD and local storage). After upgrading to 4.20.8 and
        rebooting, all disks stay online regardless of storage class.
      why: |
        The PCI topology fix operates on device addressing, independent of the
        backing storage. This guards against a regression that is storage-class
        specific.
      acceptance_criteria:
        - "All disks online after upgrade and reboot"
        - "Result is identical across the two storage classes"
    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "pytest functional over live cluster upgrade"
    specific_preconditions:
      - name: "Two storage classes"
        requirement: "Windows VM with disks split across two distinct storage classes on CNV 4.19"
        validation: "oc get sc"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create Windows VM with disks on two different storage classes on CNV 4.19"
          command: "oc apply -f windows-vm-multi-sc.yaml; virtctl start <vm>"
          validation: "VMI Running; disks online"
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade CNV to 4.20.8"
          command: "patch to 4.20.8; wait for CSV Succeeded"
          validation: "CNV CSV at 4.20.8"
        - step_id: "TEST-02"
          action: "Reboot VM"
          command: "virtctl restart <vm>"
          validation: "VMI Running"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the Windows VM"
          command: "oc delete vm <vm>"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "All disks online regardless of storage class"
        condition: "Every disk on both storage classes reports online after reboot"
        failure_impact: "Storage-class-specific regression in PCI stability"

  - scenario_id: "10"
    test_id: "TS-CNV-80969-010"
    test_type: "functional"
    priority: "P2"
    priority_comment: "P2 — memory threshold edge case (<=2GB) documented as harmless; annotate v3."
    mvp: false
    requirement_id: "CNV-80969"
    coverage_status: "NEW"
    test_objective:
      title: "Memory threshold edge case (VM with exactly 2GB memory)"
      what: |
        A Windows VM with exactly 2 GiB memory (ambiguous v1/v2 detection region)
        is upgraded to 4.20.8. The annotation is expected to show v3 (harmless per
        PR #17060) and disks remain online after reboot.
      why: |
        The memory-based version detection has an ambiguous boundary at 2 GiB.
        This edge case confirms the documented harmless behavior and that disks
        stay online.
      acceptance_criteria:
        - "VMI annotation shows v3 for the 2 GiB VM"
        - "All disks online after reboot"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest functional over live cluster upgrade"
    specific_preconditions:
      - name: "2 GiB Windows VM"
        requirement: "memory == 2 GiB, 3 VirtIO disks on CNV 4.19"
        validation: "oc get vmi <vm> -o jsonpath='{.spec.domain.memory}'"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create Windows VM with exactly 2 GiB memory and 3 VirtIO disks on CNV 4.19"
          command: "oc apply -f windows-vm-2gb.yaml; virtctl start <vm>"
          validation: "VMI Running; 3 disks online"
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade CNV to 4.20.8"
          command: "patch to 4.20.8; wait for CSV Succeeded"
          validation: "CNV CSV at 4.20.8"
        - step_id: "TEST-02"
          action: "Reboot VM"
          command: "virtctl restart <vm>"
          validation: "VMI Running"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the Windows VM"
          command: "oc delete vm <vm>"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Annotation is v3 for 2 GiB VM"
        condition: "VMI PCI topology version annotation == v3"
        failure_impact: "Ambiguous detection produces unexpected topology"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "All disks online after reboot"
        condition: "All 3 disks report online"
        failure_impact: "Edge-case memory VMs suffer offline disks"

  - scenario_id: "11"
    test_id: "TS-CNV-80969-011"
    test_type: "integration"
    priority: "P2"
    priority_comment: "P2 — annotation must persist across live migration (controller propagation)."
    mvp: false
    requirement_id: "CNV-80969"
    coverage_status: "NEW"
    test_objective:
      title: "Annotation persistence across live migration"
      what: |
        A Windows VM on 4.20.8 with the v3 annotation is live-migrated to another
        node. The PCI topology annotation must be preserved on the target node
        and disks must stay at stable addresses across a subsequent stop/start.
      why: |
        Live migration re-creates the virt-launcher pod on the target node; the
        controller must propagate the topology annotation so addressing does not
        change mid-flight.
      acceptance_criteria:
        - "PCI topology annotation is preserved on the target node after migration"
        - "Disks remain at stable addresses after a stop/start"
    classification:
      test_type: "Integration"
      scope: "Multi-component"
      automation_approach: "pytest integration over multi-node cluster"
    specific_preconditions:
      - name: "Multi-node cluster"
        requirement: "Windows VM on CNV 4.20.8 with v3 annotation; at least two schedulable nodes"
        validation: "oc get nodes; oc get vmi <vm> -o jsonpath='{.metadata.annotations}'"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create Windows VM on CNV 4.20.8 with v3 annotation, running"
          command: "oc apply -f windows-vm.yaml; virtctl start <vm>"
          validation: "VMI Running; v3 annotation present"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute live migration of VM to another node"
          command: "virtctl migrate <vm>"
          validation: "VMIM Succeeded; VMI on target node"
        - step_id: "TEST-02"
          action: "Stop and start VM after migration"
          command: "virtctl stop <vm>; virtctl start <vm>"
          validation: "VMI Running"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the Windows VM"
          command: "oc delete vm <vm>"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Annotation preserved on target node"
        condition: "VMI PCI topology version annotation == v3 on target node"
        failure_impact: "Topology drift after migration; addresses may shift"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Disks at stable addresses after migration"
        condition: "Disk PCI addresses unchanged after migration and stop/start"
        failure_impact: "Migration triggers disk offline events"

  - scenario_id: "12"
    test_id: "TS-CNV-80969-012"
    test_type: "e2e"
    priority: "P2"
    priority_comment: "P2 — direct 4.19->4.20.8 upgrade (no broken build) should yield stable v3."
