    coverage_status: "NEW"
    test_objective:
      title: "Upgrade 4.19->broken->fixed, VM running at each stage, disks manually re-onlined on broken build"
      what: |
        Upgrade a running Windows Server 2022 VM (5 VirtIO disks) from CNV 4.19
        through the broken 4.20.7 build to the fixed 4.20.8 build. On the broken
        build the disks go offline (bug reproduction) and are manually re-onlined.
        After the final upgrade the VMI carries the v2 PCI topology annotation and
        all disks stay online across a stop/start cycle.
      why: |
        This is the primary customer-facing path: a VM that was rebooted on the
        broken build has already adopted v2 topology. The fix must freeze v2
        (not migrate to v3) so PCI addresses no longer shift, keeping Windows
        disks online without repeated manual intervention.
      acceptance_criteria:
        - "VMI has the v2 PCI topology annotation after upgrade to 4.20.8"
        - "All 5 disks report online in the guest after the final stop/start"
        - "Disk PCI addresses do not shift after the final reboot"
