          validation: "VMI Running"
        - step_id: "SETUP-02"
          action: "Configure udev rules referencing PCI bus addresses for disk naming"
          command: "guest: write /etc/udev/rules.d/70-disks.rules; udevadm control --reload"
          validation: "Named devices present under /dev/disk/by-... "
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade CNV directly to 4.20.8 (skip broken build)"
