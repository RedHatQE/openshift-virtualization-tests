changed_files_summary:
  total: 67
  high_impact_areas: [VM state API and validation, PVC ownership and adoption, clone and restore, RWO and RWX migration, TPM EFI and CBT persistence, end-to-end storage tests]
review_observations:
  - The design PR is merged and defines Alpha for KubeVirt v1.10; Beta and GA remain unspecified.
  - Both implementation PRs are open, and PR 19173 remains a draft.
  - PR 19173's description is incomplete despite its large implementation scope.
  - Jira CNV-98256 inaccurately describes PR 19173 as merged.
fix_scope:
  user_visible_changes:
    - Users can explicitly create or reuse VM state storage.
    - Cloned or recreated VMs can reuse preserved TPM and EFI state.
    - Migration behavior differs by access mode and whether a creation template is available.
  failure_paths:
    - Reject missing source and template.
    - Reject non-filesystem storage and fixed names on generated templates.
    - Prevent concurrent use of one state PVC by running VMs.
    - Block RWO live migration when only an adopted source is provided.
  compatibility:
    - Existing VMs without the new field continue using implicit state storage.
    - Disabling the Alpha gate does not strand VMs already using declarative state.
