[pytest]
# Isolation from the project's top-level conftest.py (which requires an
# OpenShift cluster connection) comes from rootdir selection: running with
# this ini via -c makes this directory the rootdir, so no ancestor
# conftest.py is loaded.
filterwarnings =
    error::pytest.PytestCollectionWarning
    # Upstream deprecation in ocp_resources.daemonset, imported via
    # utilities/infra.py — out of scope for this repo; fix happens upstream.
    ignore:ocp_resources.daemonset is deprecated:DeprecationWarning
